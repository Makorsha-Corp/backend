name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Older mock-based tests in tests/*.py. No database needed.
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy values: a few tests build signed URLs and only need these to be set.
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run legacy tests
        run: python -m pytest tests --ignore=tests/unit -q -o addopts="" -p no:cacheprovider

  # The unit-test pipeline suite (tests/unit/, ~24k tests) against real Postgres.
  # 4 xdist workers; tests/unit/conftest.py gives each worker its own database
  # (marker_gw0_test, marker_gw1_test, ...), created and migrated automatically.
  # Strict xfails are known bugs: a fix that makes one pass fails the run until
  # its marker is removed.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        # addopts="" drops pytest.ini's -v (it would print one line per test).
        run: python -m pytest tests/unit -n 4 -q -o addopts="" -p no:cacheprovider

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marker_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marker_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Exactly one migration head
        # Guards against unmerged parallel alembic heads (has happened before:
        # duplicate 047/048/049/055/057 revisions needed merge migrations).
        run: |
          HEADS=$(alembic heads | grep -c "(head)")
          if [ "$HEADS" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $HEADS:"
            alembic heads
            exit 1
          fi
      - name: Apply full migration chain to an empty database
        run: alembic upgrade head
